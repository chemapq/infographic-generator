<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso · Infographic Generator</title>
  <link rel="icon" type="image/png"
    href="https://media.awakelab.world/MARCA_AWK26/awakelab_isotipo_fondo-blanco_transparente.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <img class="brand-logo"
        src="https://media.awakelab.world/MARCA_AWK26/awakelab_logo_fondo-oscuro_transparente.png"
        alt="Awakelab">
    </span>
    <span class="brand-app">Infographic <strong>Generator</strong></span>
  </header>

  <main class="login-main">
    <form id="login-form" class="login-card">
      <h1>Iniciar sesión</h1>
      <p class="lede">Introduce la contraseña para entrar en el generador de infografías.</p>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password"
        autofocus required>
      <button type="submit" id="btn-login" class="cta">Entrar</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </main>

  <script>
    (() => {
      'use strict';
      const form = document.getElementById('login-form');
      const input = document.getElementById('password');
      const boton = document.getElementById('btn-login');
      const error = document.getElementById('login-error');

      /**
       * A dónde volver tras entrar. Solo rutas de este sitio: así el login no
       * se convierte en un redirector abierto. El `#/job/...` no llega al
       * servidor (los fragmentos no se envían), pero el navegador lo conserva
       * al redirigir, así que se recupera aquí para no perder el enlace.
       */
      function destino() {
        const next = new URLSearchParams(location.search).get('next') || '/';
        const ruta = /^\/(?!\/)/.test(next) ? next : '/';
        return ruta.includes('#') ? ruta : ruta + location.hash;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        boton.disabled = true;
        boton.textContent = 'Comprobando…';
        error.hidden = true;
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: input.value }),
          });
          const payload = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(payload.error || `El servidor respondió ${res.status}.`);
          location.href = destino();
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
          input.select();
        } finally {
          boton.disabled = false;
          boton.textContent = 'Entrar';
        }
      });
    })();
  </script>
</body>
</html>
