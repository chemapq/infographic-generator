# Blueprint de Render: New → Blueprint → conecta el repo y Render lo lee solo.
# Pensado para el plan free: sin disco (los jobs no sobreviven a un redeploy
# ni a que el servicio se duerma por inactividad). Para persistencia real,
# sube a un plan de pago y añade un disk montado en /app/output — ver DEPLOY.md.
services:
  - type: web
    name: infographic-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Secretos: no se guardan en este fichero. Render los pide al crear el
      # servicio desde el Blueprint.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      # Para clientes servidor-a-servidor. Formato "nombre:clave,nombre2:clave2"
      # — ver README § API v1. Puede dejarse vacío: el plugin de Moodle ya no
      # la usa, y este despliegue puede servir solo la interfaz web.
      - key: API_KEYS
        sync: false
      # Secreto compartido con el plugin de Moodle, que incrusta esta app en un
      # iframe. Tiene que coincidir con el ajuste homónimo del plugin. Vacío =
      # /embed responde 404.
      - key: EMBED_SECRET
        sync: false
      # El Moodle que puede incrustarla, p. ej. https://moodle.ejemplo.com.
      # Vacío = sin cabecera frame-ancestors (cualquiera podría enmarcarla).
      - key: EMBED_ALLOWED_ORIGINS
        sync: false
      # Generado por Render al crear el servicio; no hace falta tocarlo. Firma
      # también las sesiones que abre un ticket de Moodle.
      - key: AUTH_SECRET
        generateValue: true
